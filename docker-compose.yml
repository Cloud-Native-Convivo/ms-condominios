services:
  oracle-condominios:
    image: gvenzl/oracle-free:23.5-slim
    container_name: oracle-condominios
    restart: unless-stopped
    # 1523 en el host: 1521 y 1522 ya lo ocupan oracle-espacios y oracle-gastos
    ports:
      - "1523:1521"
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-oracle_password}
      APP_USER: ${DB_USERNAME:-admin}
      APP_USER_PASSWORD: ${DB_PASSWORD:-oracle_password}
      ORACLE_PDB: freepdb1
    volumes:
      - oracle_condominios_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - convivo-network

  ms-condominios:
    build: .
    container_name: ms-condominios
    restart: unless-stopped
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - convivo-network
    environment:
      DB_HOST: oracle-condominios
      DB_PORT: 1521
      DB_NAME: freepdb1
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-oracle_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USUARIO: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_CONTRASENA: ${RABBITMQ_PASSWORD:-guest}
      EUREKA_URL: http://admin:${EUREKA_PASSWORD:-admin123}@discovery-server:8761/eureka/
      EUREKA_IP: ms-condominios
      EUREKA_PORT: 8084
      PUERTO: 8084
    depends_on:
      oracle-condominios:
        condition: service_healthy

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: convivo-condominios-scanner
    profiles:
      - tools
    env_file:
      - path: .env
        required: false
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_TOKEN:-}
    volumes:
      - ./:/usr/src
    networks:
      - convivo-network

volumes:
  oracle_condominios_data:

networks:
  convivo-network:
    external: true
    name: convivo-network
